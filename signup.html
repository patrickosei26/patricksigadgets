<!DOCTYPE html>
<html lang="en-GH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PATRICK IGADGETS</title>
    <!-- Professional Font -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="login-box">
            <h1>Create Account</h1>
            <p>Join the premium iPhone community in Kumasi.</p>

            <form action="index.html" method="get">
                <!-- Full Name -->
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="e.g. Kwesi Mensah" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>

                <!-- Phone Number -->
                <div class="input-group">
                    <label>Phone Number (WhatsApp)</label>
                    <input type="tel" placeholder="024 XXX XXXX" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Min. 8 characters" required>
                </div>

                <button type="submit" class="login-btn">Create Account</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
                <p class="terms">By joining, you agree to our <a href="#">Terms of Service</a>.</p>
            </div>
        </div>
    </main>

</body>
</html>
